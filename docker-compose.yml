services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: journal
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journal}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal -d journal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  journal:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      DATABASE_URL: postgresql://journal:${POSTGRES_PASSWORD:-journal}@postgres:5432/journal
      # Optional: require a password (recommended when exposed beyond localhost)
      # JOURNAL_PASSWORD: change-me
      # Optional: stable encryption secret for broker credentials at rest
      # JOURNAL_SECRET: change-me-too
      JOURNAL_DATA_DIR: /data
      SAXO_APP_KEY: ${SAXO_APP_KEY:-}
      SAXO_APP_SECRET: ${SAXO_APP_SECRET:-}
      SAXO_REDIRECT_URI: ${SAXO_REDIRECT_URI:-http://localhost:3000/api/saxo/callback}
      SAXO_ENVIRONMENT: ${SAXO_ENVIRONMENT:-live}
      SAXO_HISTORY_FROM: ${SAXO_HISTORY_FROM:-2000-01-01}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
